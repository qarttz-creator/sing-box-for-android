name: libbox

# Milestone 1: build the sing-box native core (libbox.aar) via gomobile,
# in isolation, so the riskiest native step is proven before the app build.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/libbox.yml"

env:
  SINGBOX_REF: v1.14.4          # pinned stable sing-box (native vless + hysteria2 + urltest)
  GO_VERSION: "1.25.5"          # from sing-box v1.14.4 go.mod
  NDK_VERSION: "28.0.13004108"  # fixed version build_libbox prefers

jobs:
  libbox:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          echo "y" | sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Clone sing-box ${{ env.SINGBOX_REF }}
        run: |
          # tags are needed: build_libbox runs `git describe --tags` for ldflags
          git clone --branch "$SINGBOX_REF" --depth 1 \
            https://github.com/SagerNet/sing-box sing-box-core
          git -C sing-box-core describe --tags

      - name: Install gomobile (sagernet fork)
        working-directory: sing-box-core
        run: make lib_install

      - name: Build libbox.aar
        working-directory: sing-box-core
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
          ls -lh libbox*.aar

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox
          path: |
            sing-box-core/libbox.aar
          if-no-files-found: error
