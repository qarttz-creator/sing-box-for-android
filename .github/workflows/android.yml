name: android

# Milestone 2+3: build the QartzVPN Android client (app around the sing-box core)
# into installable APKs. The native core (libbox.aar) is cached across runs.

on:
  workflow_dispatch:
    inputs:
      promote:
        description: "Опубликовать в android-latest (пользователи получат это через авто-обновление). Без галочки сборка уходит в тестовый канал android-dev."
        type: boolean
        default: false
      activation_url:
        description: "URL /activation контрол-плейна, из которого запечь стартовые маршруты в APK. Пусто → берётся переменная репозитория ACTIVATION_URL, иначе seed из репозитория."
        type: string
        default: ""
      critical:
        description: "Обязательное обновление: у клиента не будет «Позже» (тап по «Обновить» обязателен)."
        type: boolean
        default: false
      min_supported:
        description: "Минимальный versionCode. Клиенты ниже обновляются принудительно. Пусто → без принуждения."
        type: string
        default: ""
  push:
    paths:
      - "QartzVPN/**"
      - ".github/workflows/android.yml"

env:
  # Core is the Amnezia fork of sing-box (adds the `awg` endpoint). The app's libbox integration
  # (App / GatewayStatus / QartzVpnService) is written against THIS fork's libbox API.
  AWG_REPO: https://github.com/amnezia-vpn/amnezia-box
  AWG_REF: master
  XRAY_REF: v1.250911.0
  GO_VERSION: "1.25.5"
  NDK_VERSION: "28.0.13004108"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Cache libbox.aar
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: core-out/libbox.aar
          key: libbox-awg-${{ env.AWG_REF }}-ndk${{ env.NDK_VERSION }}-go${{ env.GO_VERSION }}-v2

      - name: Build libbox.aar from amnezia-box (with_awg, cache miss)
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          # NDK is only needed to compile the native core; skip it on cache hits.
          echo "y" | sdkmanager --install "ndk;${NDK_VERSION}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          git clone --branch "$AWG_REF" --depth 1 "$AWG_REPO" amnezia-box
          test -f amnezia-box/option/awg.go && echo "AWG source present"
          cd amnezia-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -tags with_awg
          mkdir -p "$GITHUB_WORKSPACE/core-out"
          cp libbox.aar "$GITHUB_WORKSPACE/core-out/libbox.aar"
          ls -lh "$GITHUB_WORKSPACE/core-out/libbox.aar"

      - name: Place core into app
        run: |
          mkdir -p QartzVPN/app/libs
          cp core-out/libbox.aar QartzVPN/app/libs/libbox.aar
          ls -lh QartzVPN/app/libs/

      # Hybrid engine: xray-core handles XHTTP (which sing-box can't). It ships as a standalone
      # executable (plain `go build`, CGO off) and is run as a child process at runtime, exactly
      # like the desktop client runs xray.exe. Named libxray.so so Android extracts it executable.
      - name: Cache xray binaries
        id: xray-cache
        uses: actions/cache@v4
        with:
          path: core-out/xray
          key: xray-${{ env.XRAY_REF }}-go${{ env.GO_VERSION }}-v1

      - name: Build xray-core (cache miss)
        if: steps.xray-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "$XRAY_REF" --depth 1 https://github.com/XTLS/Xray-core xray-core
          cd xray-core
          # GOOS=linux static binaries (CGO off) run on Android (Linux kernel) and, unlike
          # GOOS=android, don't require cgo/NDK for 32-bit arm. `env` so an expanded GOARM= is
          # parsed as an assignment, not a command.
          build() { # <goarch> <abi> [goarm]
            local out="$GITHUB_WORKSPACE/core-out/xray/$2"
            mkdir -p "$out"
            env CGO_ENABLED=0 GOOS=linux GOARCH="$1" ${3:+GOARM="$3"} \
              go build -trimpath -ldflags "-s -w" -o "$out/libxray.so" ./main
          }
          build arm64 arm64-v8a
          build arm   armeabi-v7a 7
          build amd64 x86_64
          ls -lhR "$GITHUB_WORKSPACE/core-out/xray"

      - name: Place xray into app
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "QartzVPN/app/src/main/jniLibs/$abi"
            cp "core-out/xray/$abi/libxray.so" "QartzVPN/app/src/main/jniLibs/$abi/libxray.so"
          done
          ls -lhR QartzVPN/app/src/main/jniLibs/

      # Bake the CURRENT activation routes into the APK. These are the entry routes the client uses to
      # build its first tunnel (the health check) before pulling the user's own subscription over it.
      # Fetched from the control plane's /activation so "routes changed → rebuild" needs no hand-edit;
      # if the endpoint is unset/unreachable, the seed committed in the repo is used as-is.
      # Приоритет: ACTIVATION_URL (если задан и доступен) → секрет ACTIVATION_SEED → плейсхолдер в репо.
      # Реальные маршруты в репо НЕ лежат (публичный репо), поэтому для рабочего билда нужен URL или секрет.
      - name: Bake activation seed
        env:
          ACTIVATION_URL: ${{ github.event.inputs.activation_url || vars.ACTIVATION_URL }}
          ACTIVATION_SEED: ${{ secrets.ACTIVATION_SEED }}
        run: |
          SEED=QartzVPN/app/src/main/assets/activation_seed.txt
          count() { grep -vcE '^[[:space:]]*(#|$)' "$1" 2>/dev/null || echo 0; }
          if [ -n "$ACTIVATION_URL" ]; then
            body="$(curl -fsS --max-time 20 "$ACTIVATION_URL" || true)"
            first="$(printf '%s' "$body" | sed -e 's/^[[:space:]]*//' | head -c1)"
            if [ -n "$body" ] && [ "$first" != "<" ]; then
              {
                echo "# baked at build from control plane /activation ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
                printf '%s\n' "$body" | grep -vE '^[[:space:]]*$'
              } > "$SEED"
              echo "::notice::Seed из контрол-плейна ($(count "$SEED") маршрутов)."
              exit 0
            fi
            echo "::warning::/activation недоступен/HTML — пробую секрет."
          fi
          if [ -n "$ACTIVATION_SEED" ]; then
            printf '%s\n' "$ACTIVATION_SEED" > "$SEED"
            echo "::notice::Seed из секрета ACTIVATION_SEED ($(count "$SEED") маршрутов)."
            exit 0
          fi
          echo "::warning::Ни ACTIVATION_URL, ни ACTIVATION_SEED — seed-плейсхолдер ($(count "$SEED")). Клиент НЕ загрузится без сида!"

      - name: Build APK
        working-directory: QartzVPN
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PqartzVersionCode=${{ github.run_number }} \
            -PqartzVersionName=1.0.${{ github.run_number }} \
            -PqartzDev=${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.promote == 'true') && 'false' || 'true' }}

      # Gate: only an explicit manual run with promote=true touches the user-facing
      # android-latest channel (the in-app updater reads that fixed URL). Every other
      # run (dev pushes, plain dispatch) goes to the android-dev prerelease, which the
      # updater ignores — so work-in-progress never reaches installed clients.
      - name: Determine release channel
        id: chan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.promote }}" = "true" ]; then
            echo "tag=android-latest"              >> "$GITHUB_OUTPUT"
            echo "name=QartzVPN Android (latest)"  >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                >> "$GITHUB_OUTPUT"
            echo "::notice::Канал android-latest — уйдёт пользователям."
          else
            echo "tag=android-dev"                  >> "$GITHUB_OUTPUT"
            echo "name=QartzVPN Android (dev/test)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                  >> "$GITHUB_OUTPUT"
            echo "::notice::Канал android-dev — тестовый, авто-обновление пользователей не трогает."
          fi

      - name: Write version.json
        env:
          UPD_CRITICAL: ${{ github.event.inputs.critical }}
          UPD_MIN_SUPPORTED: ${{ github.event.inputs.min_supported }}
        run: |
          # notes = верхняя секция CHANGELOG.md (единый источник «что нового»).
          NOTES=""
          [ -f CHANGELOG.md ] && NOTES=$(awk 'f&&/^## /{exit} /^## /{f=1;next} f' CHANGELOG.md)
          CRIT=false; [ "$UPD_CRITICAL" = "true" ] && CRIT=true
          MIN=0; [ -n "$UPD_MIN_SUPPORTED" ] && MIN=$UPD_MIN_SUPPORTED
          URL="https://github.com/qarttz-creator/sing-box-for-android/releases/download/${{ steps.chan.outputs.tag }}/app-universal-release.apk"
          jq -n \
            --argjson code ${{ github.run_number }} \
            --arg name "1.0.${{ github.run_number }}" \
            --arg url "$URL" \
            --arg notes "$NOTES" \
            --argjson critical $CRIT \
            --argjson min $MIN \
            '{versionCode:$code, versionName:$name, url:$url, notes:$notes, critical:$critical, min_supported:$min}' \
            > QartzVPN/app/build/outputs/apk/release/version.json
          cat QartzVPN/app/build/outputs/apk/release/version.json

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: qartzvpn-apk
          path: QartzVPN/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Rolling channels (android-dev / android-latest) must always show THIS run's build. softprops
      # updating an existing release can leave stale assets/date behind, so recreate the channel release
      # from scratch each run — its APKs, version.json, tag and date then always reflect the latest build.
      - name: Refresh channel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ steps.chan.outputs.tag }}" --yes --cleanup-tag 2>/dev/null \
            && echo "removed stale ${{ steps.chan.outputs.tag }}" \
            || echo "no previous ${{ steps.chan.outputs.tag }} to remove"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.chan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.chan.outputs.name }}
          prerelease: ${{ steps.chan.outputs.prerelease }}
          body: |
            Автосборка QartzVPN для Android.
            Канал: ${{ steps.chan.outputs.tag }}.
            - **app-arm64-v8a-release.apk** — для современных телефонов (рекомендуется)
            - app-armeabi-v7a-release.apk — старые 32-битные устройства
            - app-universal-release.apk — универсальный (крупнее), если не уверены
          files: |
            QartzVPN/app/build/outputs/apk/release/*.apk
            QartzVPN/app/build/outputs/apk/release/version.json
          fail_on_unmatched_files: true
