name: android

# Milestone 2+3: build the QartzVPN Android client (app around the sing-box core)
# into installable APKs. The native core (libbox.aar) is cached across runs.

on:
  workflow_dispatch:
    inputs:
      promote:
        description: "Опубликовать в android-latest (пользователи получат это через авто-обновление). Без галочки сборка уходит в тестовый канал android-dev."
        type: boolean
        default: false
  push:
    paths:
      - "QartzVPN/**"
      - ".github/workflows/android.yml"

env:
  SINGBOX_REF: v1.14.4
  XRAY_REF: v1.250911.0
  GO_VERSION: "1.25.5"
  NDK_VERSION: "28.0.13004108"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Cache libbox.aar
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: core-out/libbox.aar
          key: libbox-${{ env.SINGBOX_REF }}-ndk${{ env.NDK_VERSION }}-go${{ env.GO_VERSION }}

      - name: Build libbox.aar (cache miss)
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          # NDK is only needed to compile the native core; skip it on cache hits.
          sdkmanager --install "ndk;${NDK_VERSION}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          git clone --branch "$SINGBOX_REF" --depth 1 \
            https://github.com/SagerNet/sing-box sing-box-core
          cd sing-box-core
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
          mkdir -p "$GITHUB_WORKSPACE/core-out"
          cp libbox.aar "$GITHUB_WORKSPACE/core-out/libbox.aar"

      - name: Place core into app
        run: |
          mkdir -p QartzVPN/app/libs
          cp core-out/libbox.aar QartzVPN/app/libs/libbox.aar
          ls -lh QartzVPN/app/libs/

      # Hybrid engine: xray-core handles XHTTP (which sing-box can't). It ships as a standalone
      # executable (plain `go build`, CGO off) and is run as a child process at runtime, exactly
      # like the desktop client runs xray.exe. Named libxray.so so Android extracts it executable.
      - name: Cache xray binaries
        id: xray-cache
        uses: actions/cache@v4
        with:
          path: core-out/xray
          key: xray-${{ env.XRAY_REF }}-go${{ env.GO_VERSION }}-v1

      - name: Build xray-core (cache miss)
        if: steps.xray-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "$XRAY_REF" --depth 1 https://github.com/XTLS/Xray-core xray-core
          cd xray-core
          build() { # <goarch> <abi> [goarm]
            local out="$GITHUB_WORKSPACE/core-out/xray/$2"
            mkdir -p "$out"
            # Use `env` so an expanded GOARM=... is parsed as an assignment, not a command.
            env CGO_ENABLED=0 GOOS=android GOARCH="$1" ${3:+GOARM="$3"} \
              go build -trimpath -ldflags "-s -w" -o "$out/libxray.so" ./main
          }
          build arm64 arm64-v8a
          build arm   armeabi-v7a 7
          build amd64 x86_64
          ls -lhR "$GITHUB_WORKSPACE/core-out/xray"

      - name: Place xray into app
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "QartzVPN/app/src/main/jniLibs/$abi"
            cp "core-out/xray/$abi/libxray.so" "QartzVPN/app/src/main/jniLibs/$abi/libxray.so"
          done
          ls -lhR QartzVPN/app/src/main/jniLibs/

      - name: Build APK
        working-directory: QartzVPN
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PqartzVersionCode=${{ github.run_number }} \
            -PqartzVersionName=1.0.${{ github.run_number }}

      # Gate: only an explicit manual run with promote=true touches the user-facing
      # android-latest channel (the in-app updater reads that fixed URL). Every other
      # run (dev pushes, plain dispatch) goes to the android-dev prerelease, which the
      # updater ignores — so work-in-progress never reaches installed clients.
      - name: Determine release channel
        id: chan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.promote }}" = "true" ]; then
            echo "tag=android-latest"              >> "$GITHUB_OUTPUT"
            echo "name=QartzVPN Android (latest)"  >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                >> "$GITHUB_OUTPUT"
            echo "::notice::Канал android-latest — уйдёт пользователям."
          else
            echo "tag=android-dev"                  >> "$GITHUB_OUTPUT"
            echo "name=QartzVPN Android (dev/test)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                  >> "$GITHUB_OUTPUT"
            echo "::notice::Канал android-dev — тестовый, авто-обновление пользователей не трогает."
          fi

      - name: Write version.json
        run: |
          cat > QartzVPN/app/build/outputs/apk/release/version.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "url": "https://github.com/qarttz-creator/sing-box-for-android/releases/download/${{ steps.chan.outputs.tag }}/app-universal-release.apk"
          }
          JSON

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: qartzvpn-apk
          path: QartzVPN/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.chan.outputs.tag }}
          name: ${{ steps.chan.outputs.name }}
          prerelease: ${{ steps.chan.outputs.prerelease }}
          body: |
            Автосборка QartzVPN для Android.
            Канал: ${{ steps.chan.outputs.tag }}.
            - **app-arm64-v8a-release.apk** — для современных телефонов (рекомендуется)
            - app-armeabi-v7a-release.apk — старые 32-битные устройства
            - app-universal-release.apk — универсальный (крупнее), если не уверены
          files: |
            QartzVPN/app/build/outputs/apk/release/*.apk
            QartzVPN/app/build/outputs/apk/release/version.json
          fail_on_unmatched_files: true
